<div class="page">
<header class="topbar">
<div class="crumb">
<a href="projects.html" style="color:inherit">Projects</a> / <b>新建产品方案</b>
</div>
</header>
<main class="content">
<div class="page-head">
<div>
<p class="eyebrow">Create project</p>
<h1>新建产品方案</h1>
<p class="subtitle">先记录基本背景；创建后即可进入 Product Readiness 工作流。</p>
</div>
</div>
<section class="card">
<form id="create-project">
<div class="form-grid">
<div class="form-field">
<label for="name">方案名称</label>
<input id="name" required placeholder="例如：门店库存健康度周报">
</div>
<div class="form-field">
<label for="type">产品类型</label>
<select id="type">
<option>新产品 Launch</option>
<option>现有产品迭代</option>
</select>
</div>
<div class="form-field full">
<label for="idea">初始想法或背景</label>
<textarea id="idea" required placeholder="描述客户、问题、现有证据或这次希望明确的重点。">
</textarea>
</div>
<div class="form-field">
<label for="owner">负责人</label>
<input id="owner" value="DisT">
</div>
<div class="form-field">
<label for="focus">当前优先澄清</label>
<select id="focus">
<option>客户与问题</option>
<option>价值与边界</option>
<option>数据与依赖</option>
<option>评审准备</option>
</select>
</div>
</div>
<div class="actions" style="margin-top:18px">
<a class="button secondary" href="projects.html">取消</a>
<button class="button" type="submit">创建并进入工作流 →</button>
</div>
<div class="success" id="create-success">方案已在本地 Demo 中创建。下一步可进入 Product Readiness，继续澄清关键决策。</div>
</form>
</section>
</main>
</div>
</div>
<script src="assets/app.js">
</script>
</body>
</html>
