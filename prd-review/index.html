<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRD Review · 评审前检查器</title>
<style>:root{--ink:#172554;--muted:#64748b;--line:#dbe4ee;--bg:#f8fafc;--brand:#0f766e;--red:#b42318;--yellow:#a16207;--green:#067647}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:var(--ink)}header{padding:18px max(24px,calc((100vw - 1160px)/2));background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.logo{font-weight:800;font-size:20px;color:var(--brand)}main{max-width:1160px;margin:30px auto;padding:0 24px}.hero h1{margin:0 0 7px;font-size:29px}.hero p{margin:0;color:var(--muted);line-height:1.6}.notice{margin:20px 0;background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;border-radius:10px;padding:12px 14px;font-size:13px}.layout{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid var(--line);border-radius:13px;padding:19px}.card h2{font-size:16px;margin:0 0 12px}.input{width:100%;height:330px;border:1px solid var(--line);border-radius:9px;padding:13px;font:14px/1.65 inherit;resize:vertical;color:#334155}.btn{border:0;background:var(--brand);color:white;border-radius:8px;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer;margin-top:12px}.empty{color:var(--muted);text-align:center;padding:80px 10px;line-height:1.7}.summary{display:none}.summary.show{display:block}.score{display:flex;align-items:end;gap:10px;padding-bottom:15px;border-bottom:1px solid var(--line)}.score strong{font-size:42px;line-height:1;color:var(--yellow)}.score span{font-size:13px;color:var(--muted)}.item{border-left:4px solid var(--yellow);padding:10px 12px;background:#fffbeb;margin-top:12px;font-size:13px;line-height:1.55}.item.high{border-color:var(--red);background:#fff1f2}.item.good{border-color:var(--green);background:#ecfdf5}.item b{display:block;margin-bottom:3px}.tag{font-size:11px;padding:3px 6px;border-radius:4px;background:white;border:1px solid #fcd34d;color:var(--yellow);float:right}@media(max-width:760px){.layout{grid-template-columns:1fr}}</style></head>
<body><header><div class="logo">PRD Review <span style="color:#94a3b8;font-weight:500">/ Gate Check</span></div><button style="border:0;background:none;color:#0f766e;cursor:pointer" onclick="location.href='../index.html'">← 方向选择</button></header><main><section class="hero"><h1>评审前完整性与风险检查</h1><p>将已有的产品说明转化为可行动的评审清单。此 Demo 以透明检查规则模拟 AI 分析，实际版本可由批准的企业模型增强语义判断。</p></section><div class="notice">为什么不是 AI 套壳：结果不仅“生成总结”，还将每个问题定位到评审维度，区分规则能确定的缺口与需要人工验证的业务判断。</div><div class="layout"><section class="card"><h2>产品说明（可编辑）</h2><textarea class="input" id="text">产品名称：市场洞察周报

我们计划为快消品牌提供每周更新的市场数据看板，帮助客户更快了解市场变化。目标客户是品牌客户，首发版本提供销售趋势、品类排名和异常提醒。

产品将使用现有零售数据，预计 10 月上线。成功后会逐步扩展到更多国家和品类。产品团队负责需求，数据团队负责数据准备。</textarea><button class="btn" id="run">开始评审检查</button></section><section class="card"><h2>Review Brief</h2><div class="empty" id="empty">点击“开始评审检查”<br>查看缺口、风险和下一步行动。</div><div class="summary" id="summary"><div class="score"><strong id="score">2/6</strong><span>核心评审维度已有基本信息<br>不建议直接进入完整执行评估</span></div><div id="items"></div></div></section></div></main>
<script>
const checks=[
['目标客户与用户角色','目标客户只写到“品牌客户”，没有明确谁实际使用、谁做何种决策。','高','补充首发客户角色（如品类经理）及其当前决策流程。','角色|品类经理|用户'],
['客户问题与证据','描述了“更快了解市场变化”，但没有客户反馈、使用频率或问题影响的证据。','高','访谈 3 位目标客户，并记录当前发现异常与采取行动的耗时。','反馈|访谈|证据|调研'],
['价值主张','“每周更新的数据”和“看板”是功能；尚未说明它如何改善具体业务结果。','中','把价值表述改写为可验证的客户结果，例如缩短补货判断周期。','缩短|决策|补货|业务结果'],
['In / Out Scope','有首发功能，但没有明确首发不做什么，范围扩张风险很高。','中','写出首发国家、品类、数据粒度，以及至少 2 个 Out of Scope。','不提供|不做|out of scope|范围'],
['数据与交付依赖','提到“现有零售数据”，但缺少覆盖、更新时效、指标口径和确认责任人。','高','请数据团队确认数据覆盖、周度更新 SLA 与指标定义。','覆盖|口径|sla|负责人'],
['成功标准','写了“成功后扩展”，但没有试点判断标准或衡量基线。','中','增加用户行为和业务价值各一个指标，并设定试点门槛。','指标|使用率|%|成功标准']];
function run(){const t=document.querySelector('#text').value.toLowerCase();let done=0,html='';checks.forEach(x=>{let found=x[4].split('|').some(k=>t.includes(k));if(found){done++;html+=`<div class="item good"><b>${x[0]} <span class="tag">已有线索</span></b>文档中出现了相关信息；仍建议在评审时确认其可验证性。</div>`}else html+=`<div class="item ${x[2]==='高'?'high':''}"><b>${x[0]} <span class="tag">${x[2]}优先级</span></b>${x[1]}<br><b style="margin-top:6px">下一步：${x[3]}</b></div>`});document.querySelector('#score').textContent=`${done}/6`;document.querySelector('#items').innerHTML=html;document.querySelector('#empty').style.display='none';document.querySelector('#summary').classList.add('show')}document.querySelector('#run').onclick=run;
</script></body></html>
