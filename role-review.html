<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DisT · 新项目评审</title><link rel="stylesheet" href="assets/app.css?v=9"><link rel="stylesheet" href="assets/ui-polish.css?v=32"></head>
<body><div class="shell"><aside class="sidebar"><div class="brand">DisT<small>PRODUCT READINESS PLATFORM</small></div><p class="nav-label">WORKSPACE</p><nav class="nav"><a href="index.html"><span class="icon">▦</span>Overview</a></nav><p class="nav-label">PROJECTS</p><nav class="nav project-nav" id="project-nav" aria-label="项目导航"></nav><div class="user-menu"><div class="user-profile"><span class="avatar" id="role-avatar">DS</span><div><b id="role-name">Dsci</b><small>当前角色</small></div></div><label class="role-picker" for="role-select">切换角色<select id="role-select"><option value="PL">PL</option><option value="Dsci">Dsci</option><option value="DA &amp; RV">DA &amp; RV</option><option value="Ops">Ops</option></select></label></div></aside><div class="page"><header class="topbar"><div class="crumb"><a href="index.html" style="color:inherit">Overview</a> / <b>团队评审</b></div><span class="tag blue" id="topbar-role">Dsci</span></header><main class="content creator-app" id="role-review-app"><section class="detail-head creator-report-intro"><p class="eyebrow">Assigned review</p><h1 id="role-review-title">新项目评审</h1><p class="subtitle" id="role-review-phase">加载当前评审阶段…</p></section><div class="creator-grid role-review-layout"><section class="card"><div class="creator-form-heading"><span class="tag blue" id="role-review-role">Dsci</span><div><h2>我的评审任务</h2><p id="role-review-focus">加载中…</p></div><span class="tag amber" id="role-review-task-status">待处理</span></div><section class="review-plan-spec" aria-labelledby="role-review-plan-spec-title"><h2 id="role-review-plan-spec-title">待评审方案规格</h2><div class="summary-item"><b>方案背景</b><span id="role-review-background"></span></div><div class="summary-item"><b id="role-review-report-label">初版报告说明</b><span id="role-review-report"></span></div><div class="review-plan-spec-grid"><div class="summary-item"><b>产品定位</b><span id="role-review-positioning"></span></div><div class="summary-item"><b>范围定义</b><span id="role-review-scope"></span></div><div class="summary-item"><b>业务要求</b><span id="role-review-business"></span></div><div class="summary-item"><b>风险与假设</b><span id="role-review-risks"></span></div></div></section><div class="summary-item review-focus"><b>评审重点</b><span id="role-review-instruction"></span></div><section id="initial-review-issue-form"><div class="form-grid"><div class="form-field"><label for="pl-issue-category">关联区块</label><select id="pl-issue-category"><option>客户价值</option><option>Scope</option><option>数据依赖</option><option>成功 KPI</option><option>交付计划</option></select></div><div class="form-field"><label for="pl-issue-priority">优先级</label><select id="pl-issue-priority"><option>阻塞</option><option>高</option><option selected>中</option><option>低</option></select></div><div class="form-field full"><label for="pl-issue-title">问题或建议</label><input id="pl-issue-title" placeholder="例如：请确认首版数据覆盖范围"></div><div class="form-field full"><label for="pl-issue-detail">背景与建议</label><textarea id="pl-issue-detail" placeholder="说明问题原因，以及需要 PL 确认或补充什么。"></textarea></div></div><div class="actions"><button class="button secondary" id="submit-pl-issue">提交首次评审 Issue</button></div></section><label class="input-label" for="pl-review-conclusion">评审结论</label><textarea id="pl-review-conclusion" placeholder="可不提 Issue，直接填写结论并完成当前轮评审。"></textarea><div class="actions"><button class="button" id="submit-pl-review">提交评审结论 →</button></div><p class="workflow-feedback" id="pl-role-feedback"></p></section><aside class="creator-side"><section class="card"><h2>我提出的 Issue / 会议项</h2><div class="check-list" id="pl-my-issues"></div></section><section class="card"><h2>评审规则</h2><ul class="progress-list"><li>首次评审可确认无 Issue。</li><li>直接回复由提出者确认；会议项在最终评审确认解决。</li><li>仅在更新报告上提交最终结论。</li></ul></section></aside></div></main></div></div><script src="assets/app.js?v=16"></script></body></html>
